# Render Blueprint for the analysis API (ADR 0006 "Hosting", docs/deploy.md).
# Schema: https://render.com/schema/render.yaml.json
#
# One Starter ($7/month, always on) Docker web service in Virginia, next to Vercel's iad1 functions. The
# browser never calls it directly: the Vercel proxy does, with X-Proxy-Token.
services:
  - type: web
    name: financial-analyst-api
    runtime: docker
    plan: starter
    region: virginia
    repo: https://github.com/bpyman/onfile
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # One process, always: the file-backed thread store and the per-thread
    # turn lock only work if every request for a thread reaches it.
    numInstances: 1
    # Deploy a commit only once its GitHub checks pass (lint, types, tests,
    # the image smoke test, and the Playwright check).
    autoDeployTrigger: checksPass
    # Rebuild only when something the image is built from changes, so a
    # web-only commit does not redeploy (and wake) the API.
    buildFilter:
      paths:
        - Dockerfile
        - .dockerignore
        - pyproject.toml
        - uv.lock
        - src/**
    envVars:
      # The public demo: lands on the live runtime (SEC EDGAR, plus OpenAI and
      # Tavily when their keys are set), and visitors can switch to the recorded
      # one. Live turns plan with the rules planner, asking OpenAI only where it is
      # unsure (ADR 0012); without OPENAI_API_KEY the rules planner plans alone.
      - key: APP_MODE
        value: "live"
      - key: PUBLIC_DEMO
        value: "true"
      - key: DEMO_LIVE_SEC
        value: "true"
      - key: ALLOW_PUBLIC_OPENAI
        value: "true"
      - key: ALLOW_PUBLIC_TAVILY
        value: "true"
      # Set in the Render dashboard, never committed. SEC_USER_AGENT names the
      # app and a contact email, e.g. "FinancialAnalystAgent (you@example.com)";
      # live SEC requests fail without it.
      - key: SEC_USER_AGENT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Shared secret with the Vercel proxy. Set in the Render dashboard (the
      # Blueprint prompts for it on first sync) and never committed.
      - key: API_PROXY_TOKEN
        sync: false
